name: build-test

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build Environments.EnvironmentMappings.sln -c Release --no-restore

      - name: Test (net10.0 + coverage)
        run: dotnet test Environments.EnvironmentMappings.Tests/Environments.EnvironmentMappings.Tests.csproj -c Release -f net10.0 --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/**/coverage.cobertura.xml
