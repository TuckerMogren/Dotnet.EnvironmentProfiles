name: Publish NuGet

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build Dotnet.EnvironmentProfiles/Dotnet.EnvironmentProfiles.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Dotnet.EnvironmentProfiles.Tests/Dotnet.EnvironmentProfiles.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack Dotnet.EnvironmentProfiles/Dotnet.EnvironmentProfiles.csproj -c Release --no-build -o ./artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGETAPIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
